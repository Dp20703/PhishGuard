services:
  - type: web
    name: phishguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # Set this in the Render dashboard to your Vercel URL
      # (e.g. https://phishguard.vercel.app), no trailing slash
      - key: ALLOWED_ORIGINS
        sync: false
