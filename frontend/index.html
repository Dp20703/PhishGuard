<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>PhishGuard — AI Phishing URL Detector</title>
  <meta name="description"
    content="Check any link for phishing. PhishGuard analyzes URL structure with a machine learning model and explains the suspicious patterns. The link is never visited." />
  <meta name="keywords"
    content="phishing detector, phishing URL checker, malicious link scanner, URL analysis, machine learning, cybersecurity" />
  <meta name="author" content="Darshan" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://phish-guard-nu-ecru.vercel.app/" />

  <!-- Theme / browser UI -->
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#020617" />
  <meta name="application-name" content="PhishGuard" />

  <!-- Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Apple / mobile -->
  <meta name="apple-mobile-web-app-title" content="PhishGuard" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp, Slack, Discord) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PhishGuard" />
  <meta property="og:title" content="PhishGuard — Is that link safe to open?" />

    content="AI-powered phishing URL detection with a risk score and explained signals." />

  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PhishGuard — Is that link safe to open?" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="PhishGuard — Is that link safe to open?" />
  <meta name="twitter:description"
    content="AI-powered phishing URL detection with a risk score and explained signals." />
  <meta name="twitter:image" content="https://phish-guard-nu-ecru.vercel.app/og-image.png" />
  <meta name="twitter:image:alt" content="PhishGuard — Is that link safe to open?" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
